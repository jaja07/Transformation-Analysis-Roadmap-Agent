services:
  db:
    image: postgres:16-alpine
    container_name: tara-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-tara_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tara_pass}
      POSTGRES_DB: ${DB_NAME:-tara_db}
    volumes:
      - tara_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tara_user} -d ${DB_NAME:-tara_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tara-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tara-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - tara-network

  frontend:
    build:
      context: ./frontend # Pointe vers le dossier de ton app React
      dockerfile: Dockerfile
    container_name: tara-react
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Évite d'écraser les modules Linux par ceux de ton hôte
    environment:
      # L'URL que ton navigateur utilisera pour contacter l'API
      - VITE_API_URL=http://localhost:8000 
      - CHOKIDAR_USEPOLLING=true # Force le hot-reload sous Docker
    depends_on:
      - backend
    networks:
      - tara-network

volumes:
  tara_data:

networks:
  tara-network:
    driver: bridge